<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>업데이트된 페이지</title>
    <style>
        body {
            font-family: 'Pretendard', sans-serif;
            text-align: center;
            padding: 20px;
            background-color: #f4f4f9;
        }
        /* 최상단 메시지 입력 칸 */
        .message-container {
            margin-bottom: 30px;
        }
        .message-input {
            width: 80%;
            max-width: 500px;
            padding: 15px;
            font-size: 16px;
            border: 2px solid #ddd;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        
        /* 팝업 버튼들 */
        .button-container {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
            margin-bottom: 30px;
        }
        .popup-btn {
            padding: 10px 20px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            transition: 0.3s;
        }
        .popup-btn:hover {
            background-color: #0056b3;
        }

        /* 팝업 스타일 */
        .popup-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
        }
        .popup-content {
            background: white;
            padding: 30px;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            min-width: 300px;
        }
        .close-btn {
            margin-top: 20px;
            padding: 8px 16px;
            background-color: #dc3545;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        /* BGM 플레이어 (숨김 처리 또는 작게 표시) */
        .bgm-container {
            margin-top: 50px;
        }
    </style>
</head>
<body>

    <!-- 1. 최상단 메시지 입력 칸 -->
    <div class="message-container">
        <input type="text" class="message-input" placeholder="여기에 메시지를 적어주세요...">
    </div>

    <!-- 2. 4개로 줄어든 팝업 버튼 -->
    <div class="button-container">
        <button class="popup-btn" onclick="openPopup(1)">팝업 1 열기</button>
        <button class="popup-btn" onclick="openPopup(2)">팝업 2 열기</button>
        <button class="popup-btn" onclick="openPopup(3)">팝업 3 열기</button>
        <button class="popup-btn" onclick="openPopup(4)">팝업 4 열기</button>
    </div>

    <!-- 팝업 오버레이 -->
    <div class="popup-overlay" id="popupOverlay">
        <div class="popup-content">
            <h2 id="popupTitle">팝업 제목</h2>
            <p id="popupDesc">팝업 내용입니다.</p>
            <button class="close-btn" onclick="closePopup()">닫기</button>
        </div>
    </div>

    <!-- 3. 변경된 BGM (YouTube Embed) -->
    <div class="bgm-container">
        <p>🎵 BGM: Daniel Caesar - Superpowers</p>
        <!-- 자동 재생을 위해 autoplay=1 추가 (브라우저 정책에 따라 클릭 후 재생될 수 있음) -->
        <iframe width="300" height="80" 
            src="https://www.youtube.com/embed/rScwLoES2bM?list=RDrScwLoES2bM&autoplay=1" 
            title="YouTube video player" frameborder="0" 
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
            allowfullscreen>
        </iframe>
    </div>

    <script>
        function openPopup(num) {
            document.getElementById('popupTitle').innerText = '팝업 ' + num;
            document.getElementById('popupDesc').innerText = '이것은 ' + num + '번째 팝업입니다.';
            document.getElementById('popupOverlay').style.display = 'flex';
        }

        function closePopup() {
            document.getElementById('popupOverlay').style.display = 'none';
        }
    </script>
</body>
</html>
